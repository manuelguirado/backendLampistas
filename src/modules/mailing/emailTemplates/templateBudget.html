<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <title>Newsletter</title>
        <style>
            body {
                margin: 0;
                padding: 0;
                background-color: #f4f4f5;
                font-family: Arial, Helvetica, sans-serif;
                color: #111827;
            }
            a {
                color: #0f766e;
            }
            .container {
                width: 100%;
                background-color: #f4f4f5;
                padding: 32px 12px;
            }
            .card {
                width: 100%;
                max-width: 640px;
                margin: 0 auto;
                background-color: #ffffff;
                border-radius: 12px;
                overflow: hidden;
                box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
            }
            .header {
                background: linear-gradient(120deg, #0f766e, #14b8a6);
                color: #ffffff;
                padding: 24px;
            }
            .header h1 {
                margin: 0;
                font-size: 24px;
                line-height: 1.3;
            }
            .content {
                padding: 24px;
                font-size: 15px;
                line-height: 1.6;
            }
            .content p {
                margin: 0 0 16px 0;
            }
            .divider {
                height: 1px;
                background-color: #e5e7eb;
                margin: 16px 0;
            }
            .footer {
                padding: 16px 24px 24px 24px;
                font-size: 12px;
                color: #6b7280;
            }
            .preheader {
                display: none !important;
                visibility: hidden;
                opacity: 0;
                color: transparent;
                height: 0;
                width: 0;
                overflow: hidden;
                
            }
        </style>
    </head>
    <body>
        
        <table class="container" role="presentation" cellspacing="0" cellpadding="0">
            <tr>
                <td>
                    <table class="card" role="presentation" cellspacing="0" cellpadding="0">
                        <tr>
                            <td class="header">
                                <h1>Budget: {{title}}</h1>
                            </td>
                        </tr>
                        <tr>
                            <td class="content">
                                {{{content}}}
                                {{items}}
                                <div class="divider"></div>
                                <p>
                                    Este es el presupuesto que se ha generado para tu proyecto. Si tienes alguna pregunta o necesitas más información, no dudes en ponerte en contacto con nosotros.
                                </p>
                            </td>
                        </tr>
                        
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
